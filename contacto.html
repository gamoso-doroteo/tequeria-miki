<style>
.contacto-section{
    padding:80px 20px;
    background:#f8f8f8;
}

.contacto-grid{
    max-width:1100px;
    margin:auto;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:40px;
}

.contacto-info-panel,
.form-premium{
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
}

.contacto-info-panel h2,
.form-premium h2{
    margin-top:0;
    color:#142b45;
}

.contact-form{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.contact-form input,
.contact-form textarea{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
}

.contact-form input:focus,
.contact-form textarea:focus{
    outline:none;
    border-color:#ffbf35;
}

.contact-form button{
    background:#ffbf35;
    color:#142b45;
    border:none;
    padding:14px;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.contact-form button:hover{
    opacity:.9;
}

.label{
    font-weight:bold;
    color:#777;
}

.value{
    font-size:18px;
    color:#142b45;
    margin-bottom:15px;
}

.social-buttons{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.social-buttons .btn{
    text-decoration:none;
    background:#142b45;
    color:white;
    padding:10px 15px;
    border-radius:10px;
}

@media(max-width:768px){
    .contacto-grid{
        grid-template-columns:1fr;
    }
}
</style>

<section class="contacto-section">

    <div class="contacto-grid">

        <div class="contacto-info-panel">

            <h2>Contacto</h2>

            <p>
                ¿Tienes alguna duda o quieres solicitar información?
                Ponte en contacto con nosotros.
            </p>

            <div class="label">Teléfono de atención</div>
            <div class="value">+52 (55) 1234-5678</div>

            <div class="social-buttons">
                <a class="btn" href="https://www.instagram.com/redlinemotors4" target="_blank">Instagram</a>

                <a class="btn" href="https://www.facebook.com/share/18vhuQsWsc/" target="_blank">Facebook</a>
            </div>

        </div>

        <div class="form-premium">

            <h2>✉ Envíanos un mensaje</h2>

            <form
                class="contact-form"
                name="contacto"
                method="POST"
                data-netlify="true"
                
            >

                <input type="hidden" name="form-name" value="contacto">

                <input
                    type="text"
                    name="nombre"
                    placeholder="Tu nombre"
                    required
                >

                <input
                    type="email"
                    name="correo"
                    placeholder="Tu correo electrónico"
                    required
                >

                <textarea
                    name="mensaje"
                    rows="5"
                    placeholder="Escribe tu mensaje"
                    required
                ></textarea>

                <button type="submit">
                    Enviar Mensaje
                </button>

            </form>

        </div>

    </div>

</section>
